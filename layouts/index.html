{{ define "main" }}
  {{ with .Content }}
    <div class="home-intro">
      {{ . }}
    </div>
    <script>
      // Type the intro out on load, like someone at a terminal. The full text is
      // in the HTML already (for crawlers and no-JS), so this only animates it.
      //
      // The numbers below are a recording, not a simulation. A model of a person
      // at a keyboard produced them once, offline; it lives in
      // scripts/record-typing.js and no longer ships to anybody. Change the
      // tagline or the speed there and re-run it to cut a new tape.
      (function () {
        var p = document.querySelector('.home-intro p');
        if (!p) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var text = p.textContent;

        /* tape:start  136 keystrokes, 280wpm, 5.90s. Regenerate with scripts/record-typing.js */
        var THINK = 161;
        var TAPE = [
          192, 37, 21, 62, 34, 28, 25, 41, 29, 107, 26, 55, 67, 44, 24, 22,
          38, 30, 30, 33, 36, 35, 26, 14, 26, 39, 39, 33, 62, 26, 50, 36, 29,
          35, 35, 47, 37, 64, 43, 27, 38, 61, 72, 25, 44, 55, 32, 96, 17, 20,
          44, 60, 31, 13, 52, 44, 42, 26, 31, 61, 31, 36, 28, 37, 31, 67, 30,
          32, 33, 24, 43, 36, 32, 68, 62, 244, 152, 27, 59, 34, 41, 68, 35,
          30, 33, 43, 17, 38, 113, 53, 34, 30, 33, 20, 49, 37, 45, 25, 25, 32,
          62, 28, 48, 43, 96, 29, 17, 38, 49, 57, 32, 14, 24, 24, 29, 26, 41,
          48, 38, 74, 45, 44, 28, 21, 28, 33, 27, 26, 73, 28, 21, 103, 60, 29,
          22, 41
        ];
        /* tape:end */

        // A tape only fits the text it was cut from. If the tagline has changed
        // since, show the line as it is rather than type out something else.
        if (TAPE.length !== text.length) return;

        p.style.minHeight = p.offsetHeight + 'px'; // keep the list from jumping
        p.textContent = '';

        var i = 0;
        (function beat() {
          if (i >= TAPE.length) {
            p.classList.remove('typing');          // leave the cursor blinking
            return;
          }
          var d = TAPE[i];
          // The cursor holds steady while the fingers are moving and goes back
          // to blinking whenever the typist stopped long enough to be thinking.
          if (d > THINK) p.classList.remove('typing');
          else p.classList.add('typing');
          setTimeout(function () {
            p.textContent = text.slice(0, ++i);
            beat();
          }, d);
        })();
      })();
    </script>
  {{ end }}
  <div class="posts-list">
    {{ range where site.RegularPages "Section" "posts" }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
{{ end }}
